<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI REI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#12121c;--border:#1e1e30;--text:#f0f0f8;--text2:#a0a0b8;--muted:#606078;--purple:#7c5cfc;--purple-s:rgba(124,92,252,0.1);--green:#22c55e;--green-s:rgba(34,197,94,0.1);--red:#ef4444;--red-s:rgba(239,68,68,0.1);--r:12px;--r-sm:8px;--r-xl:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:420px;width:100%}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--purple),#a78bfa);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:white}
.logo-text{font-size:22px;font-weight:800;letter-spacing:-0.3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:32px}
.card-title{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center}
.card-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:0.15s}
.form-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-s)}
.form-input::placeholder{color:var(--muted)}
.btn{width:100%;padding:11px 16px;border-radius:var(--r-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:0.15s;margin-top:4px}
.btn-primary{background:var(--purple);color:white}
.btn-primary:hover{background:#6d4ff5;box-shadow:0 4px 14px rgba(124,92,252,0.35)}
.btn-primary:active{transform:scale(0.98)}
.error-msg{background:var(--red-s);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r-sm);padding:10px 14px;font-size:12px;color:#fca5a5;margin-bottom:16px;display:none}
.divider{text-align:center;margin:20px 0;font-size:12px;color:var(--muted);position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
.divider::before{left:0}
.divider::after{right:0}
.footer{text-align:center;margin-top:20px;font-size:11px;color:var(--muted)}
.footer a{color:var(--purple);text-decoration:none}
.hidden{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:var(--r-sm);font-size:12px;font-weight:600;z-index:200;animation:fadeUp 0.2s ease}
.toast-error{background:var(--red-s);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.toast-success{background:var(--green-s);color:#6ee7b7;border:1px solid rgba(34,197,94,0.3)}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-icon">R</div>
    <div class="logo-text">AI REI</div>
  </div>

  <!-- Login Form -->
  <div class="card" id="login-card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your pipeline dashboard</div>
    <div class="error-msg" id="login-error"></div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
    </form>
  </div>

  <!-- Register Form -->
  <div class="card hidden" id="register-card">
    <div class="card-title">Create account</div>
    <div class="card-sub">Set up your pipeline dashboard</div>
    <div class="error-msg" id="register-error"></div>
    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" id="reg-name" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="reg-email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-password" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
    </form>
  </div>

  <div class="divider">or</div>
  <div class="footer" id="toggle-footer">
    Don't have an account? <a href="#" onclick="showRegister();return false">Create one</a>
  </div>
  <div class="footer hidden" id="toggle-login">
    Already have an account? <a href="#" onclick="showLogin();return false">Sign in</a>
  </div>
</div>

<script>
const API = '/api';

function showError(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError(el) {
  el.style.display = 'none';
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showRegister() {
  document.getElementById('login-card').classList.add('hidden');
  document.getElementById('register-card').classList.remove('hidden');
  document.getElementById('toggle-footer').classList.add('hidden');
  document.getElementById('toggle-login').classList.remove('hidden');
}
function showLogin() {
  document.getElementById('register-card').classList.add('hidden');
  document.getElementById('login-card').classList.remove('hidden');
  document.getElementById('toggle-login').classList.add('hidden');
  document.getElementById('toggle-footer').classList.remove('hidden');
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  clearError(err);
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await r.json();
    if (!r.ok) { showError(err, data.error || 'Login failed'); return; }
    localStorage.setItem('airei_token', data.token);
    localStorage.setItem('airei_user', JSON.stringify(data.user));
    toast('Signed in!', 'success');
    setTimeout(() => window.location.href = '/dashboard', 500);
  } catch(e) {
    showError(err, 'Network error — is the server running?');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('register-btn');
  const err = document.getElementById('register-error');
  clearError(err);
  const name = document.getElementById('reg-name').value;
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  if (password.length < 8) { showError(err, 'Password must be at least 8 characters'); return; }
  btn.disabled = true;
  btn.textContent = 'Creating...';
  try {
    const r = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });
    const data = await r.json();
    if (!r.ok) { showError(err, data.error || 'Registration failed'); return; }
    localStorage.setItem('airei_token', data.token);
    localStorage.setItem('airei_user', JSON.stringify(data.user));
    toast('Account created!', 'success');
    setTimeout(() => window.location.href = '/dashboard', 500);
  } catch(e) {
    showError(err, 'Network error — is the server running?');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }
}
</script>
</body>
</html>
